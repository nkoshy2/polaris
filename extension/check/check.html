<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Polaris feasibility check</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
      h1 { font-size: 1.4rem; }
      h2 { font-size: 1.1rem; margin-top: 2rem; }
      .verdict { font-weight: 600; }
      .ok { color: #116329; }
      .bad { color: #a40e26; }
      pre { background: #f4f4f4; padding: 0.75rem; overflow-x: auto; font-size: 13px; }
      button { font: inherit; padding: 0.4rem 0.9rem; margin-right: 0.5rem; }
    </style>
  </head>
  <body>
    <h1>Polaris feasibility check</h1>
    <p>
      Sign in to Canvas and Gradescope in this Chrome profile first. The check reads your data using that sign-in and
      shows the result only on this page.
    </p>
    <button id="run">Run check</button>
    <button id="copy" disabled>Copy results</button>
    <p id="status" role="status"></p>
    <div id="results"></div>
    <script type="module" src="check.js"></script>
  </body>
</html>
